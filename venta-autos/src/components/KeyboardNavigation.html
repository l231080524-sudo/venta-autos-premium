<section data-vista="keyboard-controls-title" class="keyboard-controls" aria-labelledby="keyboard-controls-title" data-enlace="keyboard-controls-title">
  <div class="keyboard-controls-heading">
    <h2 id="keyboard-controls-title">Controles de navegación por teclado</h2>
    <button type="button" data-enlace="desactivar">Desactivar</button>
  </div>
  <p><kbd>F6</kbd>: volver a los controles desde cualquier punto. <kbd>0</kbd> o <kbd>Ctrl + Inicio</kbd>: volver arriba. <kbd>Tab</kbd>: moverte · <kbd>Enter</kbd>: elegir · <kbd>Esc</kbd>: cerrar.</p>
  <div class="keyboard-controls-actions">
    <template data-contenido="nav-link"></template>
    <template data-contenido="nav-link-2"></template>
    <template data-contenido="nav-link-3"></template>
    <button type="button" data-keyboard-account aria-keyshortcuts="4" data-enlace="button-on-account"><template data-contenido="signed-in"></template> <kbd>4</kbd></button>
    <template data-contenido="mas-informacion"></template>
    <button type="button" aria-keyshortcuts="0" data-enlace="volver-arriba">Volver arriba <kbd>0</kbd></button>
    <button type="button" aria-keyshortcuts="ArrowUp" data-enlace="subir">Subir <kbd>↑</kbd></button>
    <button type="button" aria-keyshortcuts="ArrowDown" data-enlace="bajar">Bajar <kbd>↓</kbd></button>
  </div>
  <p class="keyboard-writing-note">Puedes pulsar el número del botón. Mientras escribes, los atajos se pausan.</p>
</section>
