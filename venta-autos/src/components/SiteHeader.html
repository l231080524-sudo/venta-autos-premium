<template id="acciones">
  <button class="menu-toggle" aria-controls="navegacion-principal" data-enlace="button-ref">
    <span class="sr-only"><template data-contenido="menu-open"></template></span>
    <span aria-hidden="true"><template data-contenido="menu-open-2"></template></span>
  </button>
  <div class="profile-disclosure" data-enlace="div-on-blur">
    <button class="profile-trigger" aria-label="Cuenta y preferencias" aria-controls="panel-cuenta" data-enlace="cuenta-y-preferencias">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"></path>
      </svg>
    </button>
    <template data-contenido="panel-cuenta"></template>
  </div>
</template>

<template id="controles">
  <template data-contenido="keyboard-navigation"></template>
  <template data-contenido="accessibility-widget"></template>
  <template data-contenido="authenticator-dialog"></template>
</template>

<section data-vista="panel-cuenta" id="panel-cuenta" class="profile-panel" aria-labelledby="cuenta-titulo">
  <div class="profile-heading">
    <h2 id="cuenta-titulo"><template data-contenido="usuario"></template></h2>
    <button aria-label="Cerrar cuenta y preferencias" data-enlace="cerrar-cuenta-y-preferencias">×</button>
  </div>
  <template data-contenido="p"></template>
  <template data-contenido="app-autenticadora"></template>
</section>

<p data-vista="p" class="profile-name"><template data-contenido="nombre"></template></p>

<button data-vista="iniciar-sesion" class="primary-button" data-enlace="iniciar-sesion">Iniciar sesión</button>

<template id="app-autenticadora">
  <button class="primary-button" data-enlace="app-autenticadora">App autenticadora</button>
  <button class="logout-button" data-enlace="cerrar-sesion">Cerrar sesión</button>
</template>
